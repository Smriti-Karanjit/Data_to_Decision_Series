version: 2

models:
  - name: stg_ercot_load_1h
    description: "Hourly ERCOT load (cleaned in Databricks CE, exported as CSV, loaded via dbt seed)."
    columns:
      - name: hour_ts
        tests: [not_null, unique]

      - name: ercot_mw
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "ercot_mw > 0"
