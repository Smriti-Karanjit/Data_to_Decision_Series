version: 2

models:
  - name: fct_capacity_risk
    description: "Hourly ERCOT demand labeled into LOW/MEDIUM/HIGH/EXTREME using fixed baseline thresholds."
    columns:
      - name: hour_ts
        tests: [not_null, unique]
      - name: ercot_mw
        tests: [not_null]
      - name: risk_level
        tests:
          - not_null
          - accepted_values:
              values: ['LOW','MEDIUM','HIGH','EXTREME']

  - name: fct_capacity_risk_monthly
    description: "Monthly rollup of total hours, HIGH/EXTREME hours, and risk shares."
    columns:
      - name: month
        tests: [not_null, unique]
      - name: total_hours
        tests: [not_null]
      - name: high_hours
        tests: [not_null]
      - name: extreme_hours
        tests: [not_null]

  - name: fct_capacity_alerts
    description: "Monthly risk summary with alert flag and recommended operational action."
    columns:
      - name: month
        tests: [not_null, unique]
      - name: extreme_hours
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "extreme_hours >= 0"
      - name: high_hours
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "high_hours >= 0"
      - name: alert_flag
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]

  - name: fct_capacity_scenarios
    description: "Scenario simulation of projected HIGH/EXTREME hours under demand growth multipliers."
    columns:
      - name: month
        tests: [not_null]
      - name: scenario
        tests:
          - not_null
          - accepted_values:
              values: ['GROWTH_2PCT','GROWTH_5PCT','GROWTH_8PCT']
      - name: projected_extreme_hours
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "projected_extreme_hours >= 0"
      - name: projected_high_hours
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "projected_high_hours >= 0"

  - name: mart_capacity_readiness
    description: "Final decision layer combining monthly risk exposure, alerts, and scenario deltas into readiness levels."
    columns:
      - name: month
        tests: [not_null, unique]
      - name: readiness_level
        tests:
          - not_null
          - accepted_values:
              values: ['GREEN','AMBER','RED']
      - name: recommended_action
        tests: [not_null]
      - name: delta_extreme_5pct
        tests: [not_null]
