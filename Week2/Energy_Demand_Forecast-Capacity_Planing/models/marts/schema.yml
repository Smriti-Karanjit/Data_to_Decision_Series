version: 2

models:

  # =========================
  # FACT: Monthly Risk
  # =========================
  - name: fct_capacity_risk_monthly
    description: "Monthly aggregation of ERCOT hourly risk classification."
    columns:
      - name: month
        tests:
          - not_null
          - unique

      - name: total_hours
        tests:
          - not_null

      - name: high_hours
        tests:
          - not_null

      - name: extreme_hours
        tests:
          - not_null

      - name: pct_high
        tests:
          - not_null

      - name: pct_extreme
        tests:
          - not_null


  # =========================
  # FACT: Alerts
  # =========================
  - name: fct_capacity_alerts
    description: "Operational alert flags based on monthly extreme/high thresholds and streak logic."
    columns:
      - name: month
        tests:
          - not_null
          - unique

      - name: alert_flag
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]

      - name: extreme_hours
        tests:
          - not_null

      - name: high_hours
        tests:
          - not_null


  # =========================
  # FACT: Scenarios
  # =========================
  - name: fct_capacity_scenarios
    description: "Projected monthly extreme/high hours under demand growth scenarios."
    columns:
      - name: month
        tests:
          - not_null

      - name: scenario
        tests:
          - not_null
          - accepted_values:
              values: ['GROWTH_2PCT','GROWTH_5PCT','GROWTH_8PCT']

      - name: projected_extreme_hours
        tests:
          - not_null

      - name: projected_high_hours
        tests:
          - not_null

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['month', 'scenario']


  # =========================
  # MART: KPIs
  # =========================
  - name: mart_capacity_kpis
    description: "Decision-ready monthly KPIs combining risk, alerts, and growth projections."
    columns:
      - name: month
        tests:
          - not_null
          - unique

      - name: alert_flag
        tests:
          - not_null

      - name: delta_extreme_5pct
        tests:
          - not_null


  # =========================
  # MART: Readiness
  # =========================
  - name: mart_capacity_readiness
    description: "Capacity readiness classification (GREEN/AMBER/RED) with recommended actions."
    columns:
      - name: month
        tests:
          - not_null
          - unique

      - name: readiness_level
        tests:
          - not_null
          - accepted_values:
              values: ['GREEN','AMBER','RED']

      - name: recommended_action
        tests:
          - not_null