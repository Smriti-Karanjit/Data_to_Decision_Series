version: 2

models:
  - name: fct_capacity_risk
    description: "Hourly ERCOT demand labeled into LOW/MEDIUM/HIGH/EXTREME risk bands using fixed baseline thresholds."
    columns:
      - name: hour_ts
        tests: [not_null, unique]
      - name: ercot_mw
        tests: [not_null]
      - name: risk_level
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['LOW','MEDIUM','HIGH','EXTREME']

  - name: fct_capacity_alerts
    description: "Monthly risk summary with longest streaks, alert flag, and recommended operational action."
    columns:
      - name: month
        tests: [not_null, unique]
      - name: extreme_hours
        tests: [not_null]
      - name: high_hours
        tests: [not_null]
      - name: alert_flag
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]

  - name: fct_capacity_scenarios
    description: "Scenario simulation of projected HIGH/EXTREME hours under demand growth multipliers (2%, 5%, 8%)."
    columns:
      - name: month
        tests: [not_null]
      - name: scenario
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['GROWTH_2PCT','GROWTH_5PCT','GROWTH_8PCT']
      - name: projected_extreme_hours
        tests: [not_null]
      - name: projected_high_hours
        tests: [not_null]

  - name: fct_capacity_risk_monthly
    description: "Monthly rollup of HIGH/EXTREME hours and percent of month in risk."
    columns:
      - name: month
        tests: [not_null, unique]
      - name: total_hours
        tests: [not_null]
      - name: high_hours
        tests: [not_null]
      - name: extreme_hours
        tests: [not_null]
      - name: pct_high
        tests: [not_null]
      - name: pct_extreme
        tests: [not_null]

